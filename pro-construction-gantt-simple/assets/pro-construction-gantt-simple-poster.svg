    <rect x="780" y="14" width="116" height="30" rx="15" fill="#2563eb"/><text x="838" y="34" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">LOOK-AHEAD</text>
