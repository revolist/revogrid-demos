<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Advanced Filtering Order Explorer</title>
  <desc id="desc">An order grid with filter presets, global quick search, and typed columns.</desc>
  <defs>
