    <text x="150" y="610">ORD-100008</text><text x="325" y="610">Sofia Rossi</text><text x="545" y="610">Pending Review</text><text x="720" y="610">Europe</text><text x="900" y="610">$982.10</text><text x="1085" y="610">2026-08-01</text>
