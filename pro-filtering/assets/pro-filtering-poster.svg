      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#background)"/>
  <rect x="70" y="70" width="1300" height="760" rx="30" fill="#fff" stroke="#dbe4f0" stroke-width="3"/>
  <text x="120" y="145" fill="#172033" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="500">Advanced Filtering: Order Explorer</text>
  <text x="120" y="194" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="22">Presets, cascade options, typed filters, and global quick search</text>
  <g font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500">
