<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">RevoGrid Pro Infinity Scroll remote directory</title>
  <desc id="desc">A remote user grid loading buffered row chunks with pinned status rows.</desc>
  <defs>
