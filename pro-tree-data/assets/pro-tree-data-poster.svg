<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">RevoGrid Pro Tree Data organization explorer</title>
  <desc id="desc">An expandable organization hierarchy with avatars, team details, statuses, and salaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="70" y="70" width="1300" height="760" rx="30" fill="#fff" stroke="#dbe4f0" stroke-width="3"/>
  <text x="120" y="145" fill="#172033" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="500">Tree Data: Organization Explorer</text>
  <text x="120" y="194" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="22">Expandable hierarchy, sticky parents, row ordering, filtering, and export</text>
  <g font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500">
    <rect x="120" y="230" width="150" height="50" rx="10" fill="#2563eb"/><text x="148" y="262" fill="#fff">Expand all</text>
    <rect x="286" y="230" width="160" height="50" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="315" y="262" fill="#334155">Collapse all</text>
    <rect x="462" y="230" width="190" height="50" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="489" y="262" fill="#334155">Export to Excel</text>
  </g>
  <rect x="120" y="320" width="1200" height="430" rx="16" fill="#fff" stroke="#dbe4f0" stroke-width="2"/>
  <rect x="120" y="320" width="1200" height="68" rx="16" fill="#f8fafc"/>
  <g fill="#172033" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500">
    <text x="160" y="362">Team member</text><text x="560" y="362">Team</text><text x="750" y="362">Role</text><text x="1005" y="362">Status</text><text x="1190" y="362">Salary</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">
    <text x="160" y="445">⌄  ●  Maya Chen</text><text x="560" y="445">Product</text><text x="750" y="445">VP Product</text><text x="1010" y="445" fill="#166534">● On track</text><text x="1190" y="445">$198,000</text>
    <text x="190" y="515">⌄  ●  Noah Smith</text><text x="560" y="515">Platform</text><text x="750" y="515">Engineering lead</text><text x="1010" y="515" fill="#166534">● On track</text><text x="1190" y="515">$176,000</text>
    <text x="220" y="585">●  Eva Green</text><text x="560" y="585">Platform</text><text x="750" y="585">API engineer</text><text x="1010" y="585" fill="#92400e">● At risk</text><text x="1190" y="585">$154,000</text>
    <text x="220" y="655">●  Liam Brown</text><text x="560" y="655">Platform</text><text x="750" y="655">Grid engineer</text><text x="1010" y="655" fill="#166534">● On track</text><text x="1190" y="655">$158,000</text>
    <text x="190" y="725">›  ●  Olivia Lee</text><text x="560" y="725">Experience</text><text x="750" y="725">Design lead</text><text x="1010" y="725" fill="#075985">● Planned</text><text x="1190" y="725">$165,000</text>
  </g>
  <path d="M120 470h1200M120 540h1200M120 610h1200M120 680h1200" stroke="#e2e8f0" stroke-width="2"/>
</svg>
